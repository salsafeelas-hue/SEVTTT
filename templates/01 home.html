<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEVT - Social Engineering Vulnerability Tester</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
position:relative;
background:
linear-gradient(rgba(0,255,255,.08) 1px, transparent 1px),
linear-gradient(90deg, rgba(0,255,255,.08) 1px, transparent 1px),
radial-gradient(circle at center,#07121f,#01070f 75%);
background-size:45px 45px;

}

/* Moving Scanner */

body::before{

content:"";
position:absolute;
top:-5px;
left:0;
width:100%;
height:3px;
background:cyan;
box-shadow:0 0 25px cyan;
animation:scan 5s linear infinite;

}

@keyframes scan{

0%{top:-5px;}
100%{top:100%;}

}

/* Binary Numbers */

.binary{

position:absolute;
font-size:22px;
color:rgba(0,255,255,.15);
font-family:monospace;
animation:float 12s linear infinite;

}

.b1{left:8%;top:8%;}
.b2{right:10%;top:18%;}
.b3{left:12%;bottom:12%;}
.b4{right:15%;bottom:20%;}

@keyframes float{

0%{transform:translateY(0);}
50%{transform:translateY(-15px);}
100%{transform:translateY(0);}

}

/* Floating Icons */

.icon{

position:absolute;
font-size:38px;
color:rgba(0,255,255,.35);
animation:move 6s ease-in-out infinite;

}

.i1{top:15%;left:25%;}
.i2{top:20%;right:22%;}
.i3{bottom:18%;left:20%;}
.i4{bottom:15%;right:20%;}
.i5{top:50%;left:8%;font-size:32px;}
.i6{top:50%;right:8%;font-size:32px;}

@keyframes move{

0%,100%{
transform:translateY(0);
}

50%{
transform:translateY(-20px);
}

}

/* Circuit Lines */

.corner1,
.corner2{

position:absolute;
width:220px;
height:220px;
border:2px solid rgba(0,255,255,.2);

}

.corner1{

top:20px;
left:20px;
border-right:none;
border-bottom:none;

}

.corner2{

bottom:20px;
right:20px;
border-left:none;
border-top:none;

}

/* Main Card */

.container{

width:70%;
max-width:850px;
padding:60px;
text-align:center;
background:rgba(255,255,255,.05);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.15);
border-radius:20px;
box-shadow:0 0 30px rgba(0,255,255,.15);
z-index:5;

}

h1{

font-size:90px;
letter-spacing:8px;
color:#00ffff;
text-shadow:
0 0 10px cyan,
0 0 20px cyan,
0 0 40px cyan;

}

.description{

margin-top:10px;
font-size:20px;
color:#d7f9ff;

}

.tagline{

margin:35px 0;
font-size:34px;
font-weight:bold;
color:white;
line-height:1.4;
text-shadow:0 0 10px cyan;

}

button{

padding:16px 45px;
font-size:20px;
font-weight:bold;
border:none;
border-radius:50px;
cursor:pointer;
background:transparent;
color:cyan;
border:2px solid cyan;
transition:.4s;
box-shadow:0 0 20px rgba(0,255,255,.4);

}

button:hover{

background:cyan;
color:black;
transform:scale(1.08);
box-shadow:
0 0 25px cyan,
0 0 50px cyan;

}

/* Terminal Text */

.terminal{

position:absolute;
bottom:20px;
left:20px;
font-family:monospace;
font-size:15px;
color:#00ff99;
line-height:28px;

}

@media(max-width:768px){

.container{

width:90%;
padding:35px;

}

h1{

font-size:55px;

}

.tagline{

font-size:24px;

}

.description{

font-size:16px;

}

button{

font-size:18px;
padding:14px 35px;

}

.icon{

display:none;

}

}

</style>
</head>

<body>

<div class="corner1"></div>
<div class="corner2"></div>

<div class="binary b1">010110101001011</div>
<div class="binary b2">110010101010111</div>
<div class="binary b3">101001101010011</div>
<div class="binary b4">011010010111001</div>

<i class="fas fa-lock icon i1"></i>
<i class="fas fa-shield-halved icon i2"></i>
<i class="fas fa-key icon i3"></i>
<i class="fas fa-envelope icon i4"></i>
<i class="fas fa-user-secret icon i5"></i>
<i class="fas fa-microchip icon i6"></i>

<div class="container">

<h1>SEVT</h1>

<div class="description">
Social Engineering Vulnerability Tester using AI
</div>

<div class="tagline">
"Test yourself before an attacker tests you."
</div>

<a href="/login">
    <button class="get-started-btn">Get Started</button>
</a>

</div>



</div>

</body>
</html>
